name: Cross-Platform Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            lib_path: dcv/lib/linux
            bridge_output: dcv/lib/linux/libbridge.so
            cmake_generator: "Unix Makefiles"
            archive_name: "linux-x64"
          - os: macos-latest
            platform: mac
            lib_path: dcv/lib/mac
            bridge_output: dcv/lib/mac/libbridge.dylib
            cmake_generator: "Unix Makefiles"
            archive_name: "macos-universal"
          - os: windows-latest
            platform: windows
            lib_path: dcv/lib/win
            bridge_output: dcv/lib/win/Release/bridge.dll
            cmake_generator: "Visual Studio 17 2022"
            archive_name: "windows-x64"

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Install CMake (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: 'latest'

    - name: Setup MSVC (Windows)
      if: matrix.os == 'windows-latest'
      uses: microsoft/setup-msbuild@v2

    # cgo needs a GCC-compatible compiler to build/run Go code.
    # GitHub Actions runners do not ship MinGW, so install it via MSYS2.
    - name: Setup MinGW (Windows)
      if: matrix.os == 'windows-latest'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: mingw-w64-x86_64-gcc

    # STEP 1: BUILD BRIDGE LIBRARY FIRST
    - name: Create build directory (Linux/Windows)
      if: matrix.os != 'macos-latest'
      run: mkdir build

    # macOS needs two architecture builds (arm64 + x86_64) so the
    # bridge can be combined into a universal binary with lipo.
    - name: Create build directories (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        mkdir -p build_arm64 build_x86_64

    - name: Configure CMake (Linux)
      if: matrix.os == 'ubuntu-latest'
      working-directory: ./build
      run: |
        cmake .. -G "${{ matrix.cmake_generator }}" -DCMAKE_BUILD_TYPE=Release

    - name: Configure CMake (Windows)
      if: matrix.os == 'windows-latest'
      working-directory: ./build
      run: |
        cmake .. -G "${{ matrix.cmake_generator }}" -A x64

    - name: Configure CMake (macOS ARM64)
      if: matrix.os == 'macos-latest'
      working-directory: ./build_arm64
      run: |
        cmake .. -G "${{ matrix.cmake_generator }}" -DCMAKE_OSX_ARCHITECTURES=arm64

    - name: Configure CMake (macOS x86_64)
      if: matrix.os == 'macos-latest'
      working-directory: ./build_x86_64
      run: |
        cmake .. -G "${{ matrix.cmake_generator }}" -DCMAKE_OSX_ARCHITECTURES=x86_64

    - name: Build bridge library (Linux)
      if: matrix.os == 'ubuntu-latest'
      working-directory: ./build
      run: |
        make -j$(nproc)

    - name: Build bridge library (Windows)
      if: matrix.os == 'windows-latest'
      working-directory: ./build
      run: |
        cmake --build . --config Release

    - name: Build bridge library (macOS ARM64)
      if: matrix.os == 'macos-latest'
      working-directory: ./build_arm64
      run: |
        make -j$(sysctl -n hw.ncpu)

    # Preserve the ARM64 binary before the x86_64 build overwrites it.
    - name: Save ARM64 bridge binary (macOS)
      if: matrix.os == 'macos-latest'
      run: cp dcv/lib/mac/libbridge.dylib libbridge_arm64.dylib

    - name: Build bridge library (macOS x86_64)
      if: matrix.os == 'macos-latest'
      working-directory: ./build_x86_64
      run: |
        make -j$(sysctl -n hw.ncpu)

    - name: Create universal bridge binary (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        lipo -create \
          libbridge_arm64.dylib \
          dcv/lib/mac/libbridge.dylib \
          -output dcv/lib/mac/libbridge.dylib
        lipo -info dcv/lib/mac/libbridge.dylib
        rm -f libbridge_arm64.dylib

    # Make the MSVC import library available to the Go linker on Windows.
    - name: Copy bridge import library (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        copy build\Release\bridge.lib dcv\lib\win\bridge.lib
      shell: powershell

    - name: Verify bridge library exists
      run: |
        if [ -f "${{ matrix.bridge_output }}" ]; then
          echo "Bridge library built successfully: ${{ matrix.bridge_output }}"
          ls -la "${{ matrix.bridge_output }}"
        else
          echo "Bridge library not found at: ${{ matrix.bridge_output }}"
          echo "Contents of lib directory:"
          find ${{ matrix.lib_path }} -type f -name "*bridge*" || echo "No bridge files found"
          exit 1
        fi
      shell: bash

    # STEP 2: NOW TEST THE GO MODULE (after bridge is built)
    - name: Test Go module dependencies
      run: |
        go mod tidy
        go mod verify

    - name: Run Go tests (Windows)
      if: matrix.os == 'windows-latest'
      env:
        CGO_ENABLED: 1
        CC: C:\msys64\mingw64\bin\gcc.exe
        GOCACHE: ${{ runner.temp }}/gocache
      run: |
        # Add DLL directories to PATH
        $currentPath = $env:PATH
        $dllPath1 = Join-Path (Get-Location) "dcv\lib\win"
        $dllPath2 = Join-Path (Get-Location) "dcv\lib\win\Release"
        $env:PATH = "$currentPath;$dllPath1;$dllPath2"
        Write-Host "Updated PATH with DLL directories"
        go test -v
      shell: powershell

    - name: Run Go tests (Linux/macOS)
      if: matrix.os != 'windows-latest'
      env:
        CGO_ENABLED: 1
        LD_LIBRARY_PATH: ${{ github.workspace }}/${{ matrix.lib_path }}:$LD_LIBRARY_PATH
        DYLD_LIBRARY_PATH: ${{ github.workspace }}/${{ matrix.lib_path }}:$DYLD_LIBRARY_PATH
      run: |
        echo "Library path set to: ${{ github.workspace }}/${{ matrix.lib_path }}"
        go test -v
      shell: bash

    # STEP 3: CREATE SHARED LIBRARY ARCHIVES FOR DOWNLOAD
    - name: Create shared library archive (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        mkdir -p shared-libs/${{ matrix.archive_name }}
        # Copy bridge DLL
        copy "${{ matrix.bridge_output }}" shared-libs/${{ matrix.archive_name }}/
        # Copy all Dynamsoft DLLs
        copy dcv\lib\win\*.dll shared-libs\${{ matrix.archive_name }}\
        # Create info file
        echo "Platform: Windows x64" > shared-libs/${{ matrix.archive_name }}/README.txt
        echo "Bridge Library: bridge.dll" >> shared-libs/${{ matrix.archive_name }}/README.txt
        echo "Dependencies: Dynamsoft Barcode Reader v11 DLLs" >> shared-libs/${{ matrix.archive_name }}/README.txt
        echo "Usage: Add this directory to your PATH before running Go applications" >> shared-libs/${{ matrix.archive_name }}/README.txt
      shell: powershell

    - name: Create shared library archive (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        mkdir -p shared-libs/${{ matrix.archive_name }}
        # Copy bridge library
        cp "${{ matrix.bridge_output }}" shared-libs/${{ matrix.archive_name }}/
        # Copy all Dynamsoft libraries
        cp ${{ matrix.lib_path }}/* shared-libs/${{ matrix.archive_name }}/ 2>/dev/null || true
        # Create info file
        echo "Platform: ${{ matrix.platform }}" > shared-libs/${{ matrix.archive_name }}/README.txt
        echo "Bridge Library: $(basename ${{ matrix.bridge_output }})" >> shared-libs/${{ matrix.archive_name }}/README.txt
        echo "Dependencies: Dynamsoft Barcode Reader v11 libraries" >> shared-libs/${{ matrix.archive_name }}/README.txt
        if [ "${{ matrix.platform }}" = "linux" ]; then
          echo "Usage: Add this directory to LD_LIBRARY_PATH" >> shared-libs/${{ matrix.archive_name }}/README.txt
        else
          echo "Usage: Add this directory to DYLD_LIBRARY_PATH or use install_name_tool" >> shared-libs/${{ matrix.archive_name }}/README.txt
        fi
      shell: bash

    # SKIP PREPARE-CI STEP - We want to test LOCAL code, not published module
    # - name: Prepare examples for CI testing (Windows)
    #   if: matrix.os == 'windows-latest'
    #   run: |
    #     # Remove replace directives so CI tests published module
    #     .\scripts\prepare-ci.ps1
    #   shell: powershell

    # - name: Prepare examples for CI testing (Linux/macOS)
    #   if: matrix.os != 'windows-latest'
    #   run: |
    #     # Remove replace directives so CI tests published module
    #     chmod +x scripts/prepare-ci.sh
    #     ./scripts/prepare-ci.sh
    #   shell: bash

    - name: Test command-line example (using local code)
      working-directory: ./example/command-line
      env:
        CGO_ENABLED: 1
        CC: C:\msys64\mingw64\bin\gcc.exe
        GOCACHE: ${{ runner.temp }}/gocache
      run: |
        echo "Testing command-line example with local code..."
        go mod tidy
        go build -o barcode-reader-${{ matrix.platform }} .
        echo "Command-line example built successfully"

    - name: Test web example build (using local code)
      working-directory: ./example/web
      env:
        CGO_ENABLED: 1
        CC: C:\msys64\mingw64\bin\gcc.exe
        GOCACHE: ${{ runner.temp }}/gocache
      run: |
        echo "Testing web example with local code..."
        go mod tidy
        go build -o web-server-${{ matrix.platform }} .
        echo "Web example built successfully"

    # STEP 4: UPLOAD ARTIFACTS WITH SHARED LIBRARIES
    - name: Upload shared libraries
      uses: actions/upload-artifact@v4
      with:
        name: shared-libraries-${{ matrix.archive_name }}
        path: shared-libs/${{ matrix.archive_name }}/
        retention-days: 90
        if-no-files-found: warn

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.platform }}
        path: |
          ${{ matrix.bridge_output }}
          example/command-line/barcode-reader-${{ matrix.platform }}*
          example/web/web-server-${{ matrix.platform }}*
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Display structure of downloaded files
      run: |
        echo "=== Downloaded Artifacts Structure ==="
        find . -type f -name "*.dll" -o -name "*.so" -o -name "*.dylib" | head -20
        echo "=== All artifacts ==="
        ls -la
      
    - name: Create Shared Libraries Release Package
      run: |
        mkdir -p release/shared-libraries
        
        # Copy shared library archives
        if [ -d "shared-libraries-windows-x64" ]; then
          cp -r shared-libraries-windows-x64/* release/shared-libraries/ 2>/dev/null || true
        fi
        if [ -d "shared-libraries-linux-x64" ]; then
          cp -r shared-libraries-linux-x64/* release/shared-libraries/ 2>/dev/null || true
        fi
        if [ -d "shared-libraries-macos-universal" ]; then
          cp -r shared-libraries-macos-universal/* release/shared-libraries/ 2>/dev/null || true
        fi
        
        # Create comprehensive README
        cat > release/shared-libraries/USAGE.md << 'EOF'
        # goBarcodeQrSDK Shared Libraries
        
        This package contains pre-built bridge libraries and Dynamsoft dependencies for all supported platforms.
        
        ## Platform-Specific Usage:
        
        ### Windows (x64)
        - Bridge Library: `bridge.dll`
        - Dependencies: All `Dynamsoft*.dll` files
        - Usage: Add the directory containing these DLLs to your PATH environment variable
        
        ### Linux (x64)
        - Bridge Library: `libbridge.so`
        - Dependencies: All Dynamsoft `.so` files
        - Usage: Add the directory to your LD_LIBRARY_PATH: `export LD_LIBRARY_PATH=/path/to/libs:$LD_LIBRARY_PATH`
        
        ### macOS (Universal)
        - Bridge Library: `libbridge.dylib`
        - Dependencies: All Dynamsoft `.dylib` files
        - Usage: Add to DYLD_LIBRARY_PATH or use install_name_tool for permanent linking
        
        ## Integration with Go Projects:
        
        1. Download the appropriate shared libraries for your platform
        2. Set up the library path as described above
        3. Import the Go module: `go get github.com/yushulx/goBarcodeQrSDK/v2`
        4. Use the SDK in your Go application
        
        For detailed examples, see: https://github.com/yushulx/goBarcodeQrSDK/tree/main/example
        EOF
        
        # Create platform-specific archives
        cd release
        tar -czf goBarcodeQrSDK-shared-libraries-all-platforms.tar.gz shared-libraries/
        cd ..
        
    - name: Create Build Info
      run: |
        cat > release/BUILD-INFO.md << EOF
        # Build Information
        
        **Build Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        **Commit:** ${{ github.sha }}
        **Branch:** ${{ github.ref_name }}
        **Workflow:** ${{ github.workflow }}
        **Run ID:** ${{ github.run_id }}
        
        ## Supported Platforms:
        - Windows x64
        - Linux x64  
        - macOS Universal (x64/ARM64)
        
        ## Components Built:
        - Bridge libraries (C++ to Go interface)
        - Dynamsoft Barcode Reader v11 dependencies
        - Command-line example applications
        - Web server example applications
        
        ## SDK Features:
        - Multi-page document support (PDF, TIFF)
        - Page ID tracking for multi-page results
        - Real-time camera barcode scanning
        - Cross-platform compatibility
        
        ## Download Instructions:
        1. Download the shared libraries archive for your platform
        2. Extract to a directory of your choice
        3. Set up library paths as described in USAGE.md
        4. Use \`go get github.com/yushulx/goBarcodeQrSDK/v2\` in your project
        EOF
        
    - name: Upload Shared Libraries Release
      uses: actions/upload-artifact@v4
      with:
        name: goBarcodeQrSDK-shared-libraries-release
        path: |
          release/goBarcodeQrSDK-shared-libraries-all-platforms.tar.gz
          release/BUILD-INFO.md
          release/shared-libraries/USAGE.md
        retention-days: 365  # Keep for 1 year
        
    - name: Upload Individual Platform Libraries
      uses: actions/upload-artifact@v4
      with:
        name: platform-specific-libraries
        path: |
          shared-libraries-windows-x64/
          shared-libraries-linux-x64/
          shared-libraries-macos-universal/
        retention-days: 90
