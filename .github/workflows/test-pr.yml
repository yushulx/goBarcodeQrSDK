name: Test PR

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Install dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: 'latest'

    - name: Setup MSVC (Windows)
      if: matrix.os == 'windows-latest'
      uses: microsoft/setup-msbuild@v2

    # CMake uses MSVC for the native bridge, while cgo uses MinGW GCC.
    # Install GCC explicitly and export the MinGW bin directory to later steps.
    - name: Setup MinGW (Windows)
      if: matrix.os == 'windows-latest'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        path-type: inherit
        update: true
        install: mingw-w64-x86_64-gcc

    - name: Verify MinGW GCC (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $mingwBin = 'C:\msys64\mingw64\bin'
        $gcc = Join-Path $mingwBin 'gcc.exe'
        if (-not (Test-Path $gcc)) {
          Write-Host 'Installed MSYS2 files:'
          Get-ChildItem 'C:\msys64' -Recurse -Filter gcc.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          throw "MinGW GCC was not installed at $gcc"
        }
        Add-Content -Path $env:GITHUB_PATH -Value $mingwBin
        & $gcc --version

    - name: Build bridge library
      run: |
        mkdir -p build_arm64 build_x86_64
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          mkdir build
          cd build
          cmake .. -G "Visual Studio 18 2026" -A x64
          cmake --build . --config Release
          cd ..
          cp build/Release/bridge.lib dcv/lib/win/bridge.lib
        elif [ "${{ matrix.os }}" = "macos-latest" ]; then
          cd build_arm64
          cmake .. -DCMAKE_OSX_ARCHITECTURES=arm64
          make
          cd ..
          cp dcv/lib/mac/libbridge.dylib libbridge_arm64.dylib
          cd build_x86_64
          cmake .. -DCMAKE_OSX_ARCHITECTURES=x86_64
          make
          cd ..
          lipo -create libbridge_arm64.dylib dcv/lib/mac/libbridge.dylib -output dcv/lib/mac/libbridge.dylib
          rm -f libbridge_arm64.dylib
        else
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make
        fi
      shell: bash

    - name: Run tests
      env:
        CGO_ENABLED: 1
        CC: ${{ matrix.os == 'windows-latest' && 'gcc' || '' }}
        GOCACHE: ${{ runner.temp }}/gocache
      run: |
        go mod tidy
        go test -v

    - name: Verify examples compile
      env:
        CGO_ENABLED: 1
        CC: ${{ matrix.os == 'windows-latest' && 'gcc' || '' }}
        GOCACHE: ${{ runner.temp }}/gocache
      run: |
        cd example/command-line
        go mod tidy
        go build .
        cd ../web
        go mod tidy
        go build .
